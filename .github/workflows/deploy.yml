name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs and caches the Emscripten SDK (emcc/emcmake/emmake on PATH).
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Cache third_party (libssh2 + mbedtls sources)
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('build.sh') }}

      - name: Cache emscripten build objects
        uses: actions/cache@v4
        with:
          path: build
          key: emscripten-build-${{ hashFiles('build.sh', 'src/ssh_shim.c') }}
      - name: Make build script executable
        run: chmod +x ./build.sh
        
      - name: Build ssh.wasm
        run: ./build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
